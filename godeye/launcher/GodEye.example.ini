; GodEye launcher settings. Put this file next to GodEye.exe, or in %LOCALAPPDATA%\GodEye\GodEye.ini.
[godeye]
; godeye\backend of your copy of this repo, and Node.js 24+
backend=C:\path\to\gta-local-online\godeye\backend
node=C:\Program Files\nodejs\node.exe
url=http://127.0.0.1:8080/
port=8080

; The graphics card GodEye draws on (the 3D map, later the camera client and the encoder).
; List yours with:  GodEye.exe --gpus
;   gpu=RTX 5060 Ti 8GB      words of the card's name, and its memory
;   gpu=luid:0,63810         one adapter exactly (the luid from --gpus)
;   gpu=auto                 let Windows choose
; With a card named here, GodEye refuses to start on any other.
gpu=auto

; Edge or Chrome (empty = whichever is installed)
browser=

; Phase 12: open and close the camera client (a second GTA V, see godeye/README.md) together with GodEye:
; on/off, and the Python that runs godeye\camera\camera_client.py (needs `pip install pyvda`)
camera=off
python=pythonw.exe

; Optional: a Cloudflare tunnel that publishes GodEye while it is open (see godeye/README.md, "Public address")
cloudflared=
tunnel_token_file=
