# GTA Local Online — client configuration.
# Lives at <GTA folder>\LocalOnline\client.toml on every machine that plays.
# Never put passwords here in plain text once Phase 2 adds accounts: the token is a per-player
# secret generated by the server (tools will write it), not your Rockstar/Steam password.

[server]
# LAN address of the PC that runs LocalOnlineServer.exe (127.0.0.1 if it is this same PC).
# Prefer a wired address: some mesh Wi-Fi networks isolate their clients from each other.
address = "192.168.1.10"
port = 4499
enabled = true            # false = never connect (pure local play)

[player]
name = "Player"            # your name for the other players (one account per name)

[client]
startup_menu = true       # start screen after loading: STORY MODE / LOCAL ONLINE (no official Online)
menu_key = "F10"          # F1..F24 or a letter; avoid M (Gori Online), F4, F6, F7, F8, F9 (other mods)
autosave_seconds = 15     # how often the YOU character's position/state is saved while playing

[debug]
debug = false             # true = DEBUG lines in LocalOnline.log
remote_commands = false   # true = LocalOnline.cmd test channel (used by client/linux/rcmd.sh)
